name: FAQ schema sync

on:
  schedule:
    # GitHub cron is UTC and does not follow DST:
    # 11:00 UTC = 07:00 ET in summer, 06:00 ET in winter.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to Webflow (unchecked = dry run)"
        type: boolean
        default: false
      publish:
        description: "Allow the gated publish after writing"
        type: boolean
        default: false
      only:
        description: "Restrict to these paths, comma-separated (blank = all)"
        type: string
        default: ""
      host:
        description: "Which site to read FAQs from"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: write
  issues: write

concurrency:
  group: faq-schema-sync          # never let two runs write schema at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 test_sync.py

      - name: Sync FAQ schema
        id: sync
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          # Scheduled runs deliberately do NOT publish. Single Page Publishing
          # is unavailable here, so the only route is a full-site publish that
          # would ship unrelated staged Designer work. A human publishes; the
          # job just tells them there is something to publish.
          if [ "${{ inputs.publish }}" = "true" ]; then
            ARGS="$ARGS --publish"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ inputs.only }}"
          fi
          # Staging is preview only. sync.py refuses --apply against a
          # non-production host anyway; this keeps the run from failing on it.
          if [ "${{ inputs.host }}" = "staging" ]; then
            ARGS="$(echo "$ARGS" | sed 's/--apply//; s/--publish//') --host https://prompt-health.webflow.io"
          fi
          echo "running: sync.py $ARGS"
          python3 sync.py $ARGS 2>&1 | tee run.log

      - name: Verify staged schema against the live pages
        # Only meaningful after a write. Runs in CI so nobody needs a token
        # locally; a failure here stops a bad write reaching a publish.
        if: always() && inputs.host != 'staging' && (github.event_name == 'schedule' || inputs.apply == true)
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          set -o pipefail
          python3 verify.py 2>&1 | tee verify.log

      - name: Commit snapshots and state
        if: always()
        run: |
          git config user.name  "faq-schema-sync"
          git config user.email "actions@github.com"
          # state.json always: the publish gate depends on it surviving runs.
          # schemas/ only on full runs -- a scoped run has seen a subset, and
          # committing those would imply pages it never looked at are current.
          git add state.json 2>/dev/null || true
          if [ -z "${{ inputs.only }}" ]; then
            git add schemas
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "FAQ schema: sync $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Notify that schema is waiting to be published
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING=$(python3 -c "import json;print(json.load(open('state.json')).get('pending_publish',False))" 2>/dev/null || echo False)
          TITLE="FAQ schema is staged and waiting to be published"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number' 2>/dev/null || true)
          if [ "$PENDING" = "True" ]; then
            BODY=$(printf '%s\n' \
              "The FAQ schema sync wrote schema to Webflow but did not publish it." \
              "" \
              "**Publish from Webflow to make it live.** A full-site publish also ships" \
              "any other staged Designer work, so publish when you are happy for that" \
              "to go out." \
              "" \
              "The staged schema was checked against the live pages in that run" \
              "(see the 'Verify staged schema' step)." \
              "" \
              "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" && echo "commented on #$EXISTING"
            else
              gh issue create --title "$TITLE" --body "$BODY" && echo "opened issue"
            fi
          elif [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Schema has been published; nothing staged." && echo "closed #$EXISTING"
          else
            echo "nothing pending"
          fi

      - name: Run summary
        if: always()
        run: |
          {
            echo '## FAQ schema sync'
            echo '```'
            tail -n 80 run.log 2>/dev/null || echo 'no output'
            echo '```'
            if [ -f verify.log ]; then
              echo '## Verification (staged vs live)'
              echo '```'
              tail -n 60 verify.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
